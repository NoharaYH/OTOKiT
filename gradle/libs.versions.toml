[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activity = "1.10.0"
appcompat = "1.7.0"
customview = "1.2.0"
window = "1.3.0"
webkit = "1.12.1"
viewpager2 = "1.1.0"
dynamicanimation = "1.1.0"
materialColorUtilities = "2.0.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "customview" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "dynamicanimation" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

