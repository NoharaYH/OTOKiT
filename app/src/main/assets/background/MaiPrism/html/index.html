<!DOCTYPE html>
<html class="win webkit" lang="ja">
 <head>
  <meta charset="utf-8"/>

  <title>
   MaiPrism background
  </title>
  <link href="decoration.css" rel="stylesheet"/>
 </head>
 <body page="root">
  <div class="otokit-background">
   <div class="maiDecorationBg">
    <div class="background-layer">
    </div>
    <div class="pattern-layer">
    </div>
    <div class="shines-layer">

      <div class="shine star-yellow-right">
      </div>
     </div>
    </div>
    <div class="decoration-container">

      <div class="aurora aurora-front">
      </div>

      </div>
     </div>
     <div class="clouds">
      <div class="cloud front-left">
      </div>
      <div class="cloud front-right">
      </div>
      <div class="cloud front-center">
      </div>
      <div class="cloud back-left">
      </div>
      <div class="cloud back-right">
      </div>
      <div class="cloud back-center">
      </div>
     </div>
     <div class="moon">
     </div>
     <div class="shooting-stars">
      <div class="shooting-star shooting-star1">
       <div class="shooting-star-inner">
        <div class="shooting-star-tail">
        </div>
        <div class="shooting-star-head">

      <div class="shooting-star shooting-star2">

        </div>

      <div class="shooting-star shooting-star6">

        <div class="shooting-star-tail">
        </div>
        <div class="shooting-star-head">
        </div>
       </div>
      </div>
     </div>

     </div>
     <div class="rainbow-bottom">
     </div>
    </div>

   <div class="otokit-hero">
    <img alt="" class="hero-1" src="../status/storage_root_chara.webp"/>
