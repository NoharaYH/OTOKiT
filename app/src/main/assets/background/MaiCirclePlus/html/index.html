<!DOCTYPE html>
<html lang="ja" class="pc win webkit mouse">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CirclePlus background</title>
  <link rel="stylesheet" href="decoration.css">
</head>
<body class="en" mq="pc" page="root">
  <div class="maiDecorationBg">
    <div class="background-layer">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
      <div class="tile tile-green"></div>
      <div class="tile tile-purple-left"></div>
      <div class="tile tile-purple-right"></div>
      <div class="star star-pink-left"></div>
      <div class="star star-pink-right"></div>
      <div class="star star-yellow-left"></div>
      <div class="star star-yellow-right"></div>
      <div class="circle circle-colorful"></div>
      <div class="circle circle-yellow"></div>
      <div class="circle circle-white"></div>
      <div class="chara topChara"></div>
      <div class="rotation-wrapper">
        <div class="threeDemention threeDemention-cube-small"></div>
        <div class="threeDemention threeDemention-cube"></div>
        <div class="threeDemention threeDemention-star"></div>
        <div class="threeDemention threeDemention-star-small"></div>
        <div class="threeDemention threeDemention-stars"></div>
        <div class="threeDemention threeDemention-glove-blue"></div>
        <div class="threeDemention threeDemention-glove-pink"></div>
        <div class="threeDemention threeDemention-circle-pink"></div>
        <div class="threeDemention threeDemention-circle-orange"></div>
      </div>
    </div>
  </div>
<script src="../../continuous-corners.js" data-continuous-target=".maiDecorationBg .background-layer"></script>
</body>
</html>
