:root {
  color-scheme: light;
  --ink: #292a33;
  --muted: #595c61;
  --paper: #f7f7f2;
  --violet: #675095;
  --mint: #c6dedc;
  --lilac: #dacee4;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  font-family: Capsule, "Microsoft YaHei UI", "PingFang SC", sans-serif;
  background: var(--paper);
  color: var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }

.page {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
}

.shell { width: min(1120px, calc(100% - 2 * clamp(24px, 7vw, 96px))); margin-inline: auto; }
.masthead { padding-block: clamp(22px, 4vh, 38px); }
.brand { font-size: clamp(24px, 3vw, 32px); font-weight: 700; letter-spacing: -.035em; }

.landscape { position: absolute; z-index: -1; inset: 0; pointer-events: none; }
.shape { position: absolute; display: block; border-radius: 50%; }
.shape-blue { width: 84vw; height: 116vh; top: -23vh; left: 54%; background: #dee8ef; }
.shape-cream { width: 72vw; height: 68vh; top: 82%; right: 47%; background: #efedd9; }
.shape-mint { width: 69vw; height: 70vh; top: 69%; left: 57%; background: #d7e7dc; }
.shape-lilac {
  width: 36vw;
  height: 110vh;
  top: 32%;
  left: 89%;
  transform: rotate(35deg);
  border-radius: 999px;
  background: #dfd8ee;
}

.hero {
  display: grid;
  flex: 1;
  grid-template-columns: minmax(0, 1fr) minmax(0, .96fr);
  align-items: center;
  gap: clamp(22px, 4vw, 62px);
  padding-block: clamp(30px, 4vh, 56px) clamp(62px, 11vh, 118px);
}

.copy { max-width: 540px; animation: arrive .66s var(--ease-out) both; }
.provider {
  margin: 0 0 24px;
  color: #514668;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .05em;
}
.lxns .provider { color: #345f59; }

h1 {
  margin: 0;
  white-space: pre-line;
  font-size: clamp(42px, 5.25vw, 70px);
  font-weight: 700;
  line-height: 1.23;
  letter-spacing: -.046em;
}

.description, .hint { color: var(--muted); line-height: 1.65; }
.description { margin: 22px 0 0; max-width: 34em; font-size: clamp(15px, 2.2vw, 17px); }
.actions { margin-top: 30px; }
.hint { margin: 14px 0 0; font-size: 13px; }

.action {
  display: inline-flex;
  align-items: center;
  gap: 22px;
  min-height: 56px;
  padding: 0 25px;
  border-radius: 999px;
  background: var(--violet);
  color: white;
  font-weight: 700;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 160ms, transform 220ms var(--ease-out);
}
.action:hover { background: #594183; }
.action:active { transform: scale(.955); }
.action:focus-visible { outline: 2px solid #514176; outline-offset: 5px; }

.art {
  position: relative;
  display: grid;
  place-items: center;
  justify-self: center;
  width: min(100%, 470px);
  aspect-ratio: 1;
}
.kit {
  position: relative;
  display: block;
  width: 61%;
  height: auto;
  transform: rotate(-7deg);
  animation: kit-in .86s var(--ease-out) both;
}
.tile, .flower { position: absolute; display: block; }
.tile-mint {
  width: 50%;
  height: 50%;
  left: 9%;
  bottom: 11%;
  border-radius: 50% 50% 19% 19%;
  background: var(--mint);
  transform: rotate(-23deg);
}
.tile-lilac {
  width: 52%;
  height: 40%;
  top: 12%;
  right: 8%;
  border-radius: 999px;
  background: var(--lilac);
  transform: rotate(31deg);
}
.flower {
  top: 6%;
  left: 11%;
  width: 21%;
  height: auto;
  fill: #f1e3b5;
  transform: rotate(-12deg);
}

@keyframes arrive {
  from { opacity: 0; transform: translateY(18px); }
}
@keyframes kit-in {
  from { opacity: 0; transform: translateY(12%) rotate(8deg) scale(.88); }
}

@media (max-width: 720px) {
  .hero {
    flex: none;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
    padding-block: 2px 42px;
  }
  .art { grid-row: 1; width: clamp(142px, 32vh, 224px); justify-self: start; }
  .kit { width: 62%; }
  .provider { margin-bottom: 12px; }
  h1 { font-size: clamp(38px, 7vw, 52px); }
  .description { margin-top: 14px; }
  .actions { margin-top: 22px; }
  .shape-blue { width: 146vw; height: 79vh; left: 48%; top: -40vh; }
